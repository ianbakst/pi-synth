[Journal]
# Logs survive a reboot. They did not, and three separate unreachability faults
# in one afternoon were each undiagnosable for the same reason: the evidence
# died with the power cycle that recovered the box. On an appliance with no
# console and no Ethernet, that is the difference between fixing a fault and
# guessing at it.
#
# The original setting was Storage=volatile, for good reasons that still apply —
# SD write jitter on a realtime audio box, and flash wear. So this keeps them
# in view rather than trading them away wholesale:
#
#   - a hard 64M cap, so the journal can never grow into the card;
#   - SyncIntervalSec well above the 5m default, so writes are batched into
#     rare, large flushes instead of frequent small ones. Losing the last few
#     minutes of log on a pulled plug is an acceptable trade for a box that is
#     switched off by pulling the plug;
#   - rate limiting kept tight, so a log storm cannot turn into a write storm
#     during a performance.
Storage=persistent
SystemMaxUse=64M
SystemMaxFileSize=16M
SyncIntervalSec=15m
RateLimitIntervalSec=30s
RateLimitBurst=500
